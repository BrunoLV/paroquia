name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend (Java/Gradle) ────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Java 25 / Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gestao-paroquia/**/*.gradle.kts', 'gestao-paroquia/**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gestao-paroquia/gradlew

      - name: Run Checkstyle, PMD, tests and JaCoCo coverage verification
        # 'check' depende de: compileJava, test, jacocoTestReport, jacocoTestCoverageVerification, checkstyleMain, pmdMain
        run: ./gradlew check --no-daemon --configuration-cache
        working-directory: gestao-paroquia
        env:
          CI: "true"

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: gestao-paroquia/app/build/reports/jacoco/test/html/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: gestao-paroquia/app/build/reports/tests/test/

  # ─── Frontend (React/Vite/Vitest) ─────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (Node 24 / Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gestao-paroquia-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: gestao-paroquia-ui

      - name: Run Vitest (all tests, single-run)
        run: npm test
        working-directory: gestao-paroquia-ui
        env:
          CI: "true"

      - name: TypeScript type-check & production build
        run: npm run build
        working-directory: gestao-paroquia-ui
        env:
          CI: "true"
