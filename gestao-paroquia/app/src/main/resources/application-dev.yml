# Perfil de desenvolvimento local (SPRING_PROFILES_ACTIVE=dev; ativado por ./manage.sh dev).
# NUNCA ativar em produção: contém segredos públicos e desliga controles de segurança de transporte.
spring:
  flyway:
    baseline-on-migrate: true

app:
  security:
    # Mantém a chave histórica de desenvolvimento para não orfanar dados cifrados em volumes locais existentes.
    crypto-key: default-dev-fallback-key-should-be-changed-in-prod
    consent-secret: dev-only-consent-secret-do-not-use-in-production-0000

server:
  servlet:
    session:
      cookie:
        secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
