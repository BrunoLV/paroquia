spring:
  application:
    name: gestao-paroquia-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calendario}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: calendario
    default-schema: calendario
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

app:
  timezone:
    output: ${APP_TIMEZONE:America/Sao_Paulo}
  security:
    crypto-key: ${APP_CRYPTO_KEY:default-dev-fallback-key-should-be-changed-in-prod}
  paroquia:
    nome: "Paróquia Nossa Senhora de Fátima"
    diocese: "Diocese de São Miguel Paulista"
    endereco: "Rua Gijoca, 7 - Vila Curuçá Velha - São Paulo/SP"
    cor-primaria-hex: "#1A237E"
    cor-secundaria-hex: "#808080"
    logo-path: "/logo-paroquia.png"

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
