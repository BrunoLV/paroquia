spring:
  application:
    name: gestao-paroquia-api
  servlet:
    multipart:
      # Teto do framework acima do limite de 2 MB da importação (ImportacaoService), para que o excesso
      # seja recusado com mensagem de negócio (400) e não como erro genérico do container.
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/calendario}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: calendario
    default-schema: calendario
    baseline-on-migrate: true
    baseline-version: 0
    # A criação inicial do schema é sequencial; novas evoluções devem preservar sua ordem.
    out-of-order: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

app:
  timezone:
    output: ${APP_TIMEZONE:America/Sao_Paulo}
  security:
    crypto-key: ${APP_CRYPTO_KEY:default-dev-fallback-key-should-be-changed-in-prod}


management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        gestao.aprovacao: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
