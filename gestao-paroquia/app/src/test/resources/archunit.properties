# ArchUnit configuration
# Uma regra cujo conjunto "that" fica vazio deve falhar: regra vacua nao protege nada. (Foi assim que o
# ArchUnit 1.4.0, sem suporte ao bytecode do Java 25, importou 0 classes e passou todas as regras.)
archRule.failOnEmptyShould = true

# Legado arquitetural congelado (FreezingArchRule): violacoes existentes ficam neste diretorio versionado;
# qualquer violacao NOVA falha o build. Para registrar uma regra nova, habilite temporariamente
# freeze.store.default.allowStoreCreation=true, rode a suite e comite o arquivo gerado.
freeze.store.default.path = src/test/resources/archunit_store
freeze.store.default.allowStoreCreation = false
freeze.store.default.allowStoreUpdate = true

