spring:
  datasource:
    url: jdbc:h2:mem:calendar;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

logging:
  level:
    br.com.nsfatima.calendario.infrastructure.observability: DEBUG
    org.springframework.security: DEBUG

app:
  paroquia:
    nome: "Paróquia Nossa Senhora de Fátima"
    diocese: "Diocese de São Miguel Paulista"
    endereco: "Rua Gijoca, 7 - Vila Curuçá Velha - São Paulo/SP"
    cor-primaria-hex: "#1A237E"
    cor-secundaria-hex: "#808080"
    logo-path: "/logo-paroquia.png"
