# Conductor Global Spec-Driven Design Rules
version: "1.0"
metadata:
  target_project: "paroquia"
  architecture_pattern: "DDD (Domain-Driven Design) & Ports-and-Adapters"
  compliance: "LGPD-Ready (Privacy by Design)"

config:
  mode: strict
  validation: lifecycle
  allow_telemetry: false

pipeline:
  pre_spec:
    rules:
      - "GIT SYNC: Before initiating any spec or code generation, the agent MUST fetch and pull the latest changes from the remote tracking branch to avoid drift."
      - "READ and internalize the root AGENTS.md and the target child project's AGENTS.md before creating any specification."
      - "CONSULT the global privacy boundaries in gestao-paroquia/docs/ia/regra_dura_lgpd.md. Spec definitions must NEVER expose or outline PII (Personally Identifiable Information) patterns."
      - "CONSULT Graphify (graphify-out/cache/semantic/) to better understand the project architecture and dependencies before manual exploration."
      - "ALIGN with the specialized agent capabilities and styleguides defined inside the target module's conductor/code_styleguides/ and docs/ directories."
      - "MANDATORY DIRECTORY UTILIZATION: The agent MUST explicitly leverage and honor all structural constraints defined in this configuration file."

  spec_generation:
    rules:
      - "CONTEXT WINDOW OPTIMIZATION: Always consult the analytic graphs or execute local semantic searches in graphify-out/ before opening multiple code files. NEVER consume tokens loading entire files if the relationship mapped requires modifications to only a few isolated lines."
      - "MANDATORY TDD RHYTHM: Every business requirement spec generated by Conductor MUST explicitly dictate the creation of the three testing layers (Unit, Integration, and E2E) BEFORE outlining production code structures."
      - "DDD ALIGNMENT: Specs describing business logic must use Ubiquitous Language. Enforce rich domain boundaries, preventing any leak of infrastructure or framework details into Core Domain specs."
      - "STATIC ANALYSIS FOR SPECS: BANNED structural terms in code design definitions: Data, Handler, Manager, Helper, Utility."
      - "IMMUTABILITY BY DEFAULT: Focus domain specifications on pure functions, value objects, and immutable entities (like Java records or TypeScript readonly types) where possible."
      - "PORTS & ADAPTERS ENFORCEMENT: Core domain specs must only define abstractions (interfaces/ports). Infrastructure dependencies (SQL, HTTP clients) must be isolated in adapter structures."
      - "ALWAYS-VALID OBJECTS: Enforce that entities and value objects self-validate upon instantiation. Illegal domain states must throw explicit domain exceptions immediately."
      - "DATA MINIMIZATION: Specifications must strictly outline fields essential to the business process. Storage or processing of non-essential personal identifiers is prohibited."

  post_generation:
    lifecycle_hooks:
      validate_backend:
        condition: "changes_in('gestao-paroquia/**')"
        commands:
          - "cd gestao-paroquia && ./gradlew clean check test"
      validate_frontend:
        condition: "changes_in('gestao-paroquia-ui/**')"
        commands:
          - "cd gestao-paroquia-ui && npm run lint && npm run typecheck && npm run test:run"

  agent_execution:
    enforce_config_alignment: true
    error_handling:
      strategy: "self-healing"
      max_retry_attempts: 2
      retry_rules:
        - "ON validation_failure: The agent MUST analyze the test logs/compiler output, apply a strategic fix focusing strictly on core business logic, and re-run the failed lifecycle hook."
    rules:
      - "The agent is STRICTLY FORBIDDEN from bypassing defined standards or configuring alternative environments outside the specified lifecycle hooks."
      - "AUDITABILITY: Any spec introducing state changes to sensitive aggregates (e.g., permissions, finance) MUST explicitly dictate the emission of an immutable Audit Event."
      - "TOKEN STEWARDSHIP: Adhere strictly to Graphify navigation to jump directly to affected lines, minimizing loose file reads."

  git_delivery:
    commit_format: "conventional"
    enforce_scopes: ["backend", "frontend", "core", "shared", "docs", "ci"]
    approval:
      required: true
      prompt_message: "Solicitar autorização explícita do usuário antes de realizar qualquer operação de commit ou push."
    rules:
      - "Every automated execution batch must generate atomic commits following: feat(<scope>), fix(<scope>), test(<scope>), docs(<scope>), or refactor(<scope>)."
      - "MANDATORY APPROVAL: The agent MUST present the proposed changes, the specific file diffs, and the commit message to the user, waiting for explicit confirmation ('yes'/'approve') BEFORE executing the git commit."
      - "NO FORCE PUSH: The agent is strictly prohibited from executing destructive git operations (--force, --delete)."
      - "TRACEABLE COMMITS: Automated commits should append the tracking context identifier or spec file reference at the end of the commit message when available."