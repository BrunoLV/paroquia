# Conductor Global Spec-Driven Design Rules
version: "1.0"
config:
  mode: strict
  validation: lifecycle

pipeline:
  pre_spec:
    rules:
      - "READ and internalize the root AGENTS.md and the target child project's AGENTS.md before creating any specification."
      - "CONSULT the global privacy boundaries in gestao-paroquia/docs/ia/regra_dura_lgpd.md. Spec definitions must NEVER expose or outline PII (Personally Identifiable Information) patterns."
      - "ALIGN with the specialized agent capabilities defined inside .agents/skills/."

  spec_generation:
    rules:
      - "MANDATORY TDD RHYTHM: Every business requirement spec generated by Conductor MUST explicitly dictate the creation of the three testing layers (Unit, Integration, and E2E) BEFORE outlining production code structures."
      - "DDD ALIGNMENT: Specs describing business logic must use Ubiquitous Language. Enforce rich domain boundaries, preventing any leak of infrastructure or framework details into Core Domain specs."
      - "STATIC ANALYSIS FOR SPECS: BANNED structural terms in code design definitions: Data, Handler, Manager, Helper, Utility."

  post_generation:
    lifecycle_hooks:
      validate_backend:
        condition: "changes_in('gestao-paroquia/**')"
        commands:
          - "./gradlew check"
          - "./gradlew test"
      validate_frontend:
        condition: "changes_in('gestao-paroquia-ui/**')"
        commands:
          - "npm run build" # Executes tsc && vite build validation
          - "npm test"      # Executes Vitest suite

  git_delivery:
    commit_format: "conventional"
    rules:
      - "Every automated execution batch must generate atomic commits following: feat(), fix(), test(), docs(), or refactor()."