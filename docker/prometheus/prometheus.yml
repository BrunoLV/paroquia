global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'gestao-paroquia-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['api:8080']
        labels:
          application: 'gestao-paroquia-api'
          environment: 'docker-compose'
