global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'gestao-paroquia-api'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    # /actuator/prometheus exige o token APP_METRICS_SCRAPE_TOKEN (montado como secret do compose).
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_scrape_token
    static_configs:
      - targets: ['api:8080']
        labels:
          application: 'gestao-paroquia-api'
          environment: 'docker-compose'

  - job_name: 'postgres-exporter'
    scrape_interval: 5s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          application: 'postgresql'
          environment: 'docker-compose'

