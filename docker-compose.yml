# ==============================================================================
# docker-compose.yml - Arquitetura de Microsserviços e Infraestrutura da Paróquia
# ==============================================================================
# Orquestra Banco de Dados (PostgreSQL 16), Builder, API Spring Boot, Frontend (nginx),
# Ferramentas de Observabilidade (Prometheus + Grafana + Loki) e pgAdmin.
#
# SEGREDOS: nenhuma credencial tem valor padrão. Copie .env.example para .env e preencha;
# variáveis obrigatórias ausentes (${VAR:?}) abortam o `docker compose`. Serviços de infraestrutura
# (db, pgadmin, prometheus, grafana, loki, exporter) publicam portas apenas em 127.0.0.1.
# Serviços de desenvolvimento (seeder com usuários de teste e UI com hot reload) só sobem com
# `--profile dev`.
# ==============================================================================

networks:
  paroquia-net:
    name: paroquia-net
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados Relacional - PostgreSQL 16 Alpine
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: gestao-db
    restart: unless-stopped
    networks:
      - paroquia-net
    environment:
      POSTGRES_DB: calendario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./gestao-paroquia/docker/init-data.sql:/docker-entrypoint-initdb.d/init-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calendario"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Builder do Backend - Compilação e Empacotamento de JAR
  # ----------------------------------------------------------------------------
  builder:
    build:
      context: ./gestao-paroquia
      dockerfile: ../Dockerfile.builder
    container_name: gestao-builder
    networks:
      - paroquia-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TESTCONTAINERS_HOST_OVERRIDE=host.docker.internal
      - TESTCONTAINERS_RYUK_DISABLED=false
      - GRADLE_OPTS=-Dorg.gradle.workers.max=3
    volumes:
      - shared_volume:/shared
      - ./gestao-paroquia:/workspace
      - gradle_cache:/root/.gradle
    mem_limit: 4096M
    cpus: 3.0
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 4096M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Backend REST API - Spring Boot 4 / Java 25
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gestao-api
    restart: unless-stopped
    networks:
      - paroquia-net
    ports:
      - "8080:8080"
    depends_on:
      builder:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - shared_volume:/app
    environment:
      - DB_URL=jdbc:postgresql://db:5432/calendario
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - PORT=8080
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC -Djdk.virtualThreadScheduler.parallelism=2
      - APP_CRYPTO_KEY=${APP_CRYPTO_KEY:?defina APP_CRYPTO_KEY (>= 32 caracteres) no .env}
      - APP_CONSENT_SECRET=${APP_CONSENT_SECRET:?defina APP_CONSENT_SECRET (>= 32 caracteres) no .env}
      - APP_METRICS_SCRAPE_TOKEN=${APP_METRICS_SCRAPE_TOKEN:?defina APP_METRICS_SCRAPE_TOKEN no .env}
      # Cookie Secure exige HTTPS; o compose local serve HTTP. Em producao (TLS no proxy) use true.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus,metrics
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 1024M
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Seeder de Banco de Dados - Carga de dados iniciais (SOMENTE perfil dev)
  # Cria usuários de teste com senha em texto claro ({noop}senha123). Nunca usar em
  # ambiente real: `docker compose --profile dev up db-seeder` ou `./docker-env.sh seed`.
  # ----------------------------------------------------------------------------
  db-seeder:
    image: postgres:16-alpine
    container_name: gestao-db-seeder
    profiles: ["dev"]
    networks:
      - paroquia-net
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./gestao-paroquia/docker/seed-data.sql:/seed-data.sql:ro
    command: psql -v ON_ERROR_STOP=1 -h db -U postgres -d calendario -f /seed-data.sql
    mem_limit: 128M
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Frontend - build estático React servido por nginx (sem privilégios, porta 8080 interna)
  # nginx encaminha /api para a API, mantendo UI e API na mesma origem.
  # ----------------------------------------------------------------------------
  ui:
    build:
      context: ./gestao-paroquia-ui
      dockerfile: ../Dockerfile.ui
      target: runtime
      additional_contexts:
        nginxconf: ./docker/nginx
      args:
        VITE_API_URL: /api/v1
    container_name: gestao-ui
    restart: unless-stopped
    networks:
      - paroquia-net
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_started
    mem_limit: 128M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5b. Frontend de desenvolvimento - Vite com hot reload (SOMENTE perfil dev, porta 5173)
  # ----------------------------------------------------------------------------
  ui-dev:
    build:
      context: ./gestao-paroquia-ui
      dockerfile: ../Dockerfile.ui
      target: dev
    container_name: gestao-ui-dev
    profiles: ["dev"]
    networks:
      - paroquia-net
    working_dir: /app
    volumes:
      - ./gestao-paroquia-ui:/app
      - /app/node_modules
    ports:
      - "5173:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_API_PROXY_TARGET=http://api:8080
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      api:
        condition: service_started
    mem_limit: 1024M
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 6. pgAdmin 4 - Gerenciador Web do PostgreSQL
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9.1
    container_name: gestao-pgadmin
    restart: unless-stopped
    networks:
      - paroquia-net
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?defina PGADMIN_DEFAULT_EMAIL no .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?defina PGADMIN_DEFAULT_PASSWORD no .env}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    mem_limit: 256M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 7. Prometheus - Coleta e Armazenamento de Métricas (v3 LTS)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: gestao-prometheus
    restart: unless-stopped
    networks:
      - paroquia-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "127.0.0.1:9090:9090"
    secrets:
      - metrics_scrape_token
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 8. Grafana - Visualização e Dashboards de Observabilidade (v11)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: gestao-grafana
    restart: unless-stopped
    networks:
      - paroquia-net
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-grafana-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    mem_limit: 256M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 9. Loki - Agregação e Armazenamento de Logs (v3 LTS)
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.2.1
    container_name: gestao-loki
    restart: unless-stopped
    networks:
      - paroquia-net
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    mem_limit: 512M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 10. Promtail - Coleta e Envio de Logs para o Loki
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.6.8
    container_name: gestao-promtail
    restart: unless-stopped
    # Permanece root: descobrir containers via /var/run/docker.sock exige acesso ao socket (equivalente a
    # root no host de qualquer forma; ':ro' no bind nao restringe a API do Docker). Rodar sem root exigiria
    # group_add com o GID do grupo docker do host, que varia por maquina.
    user: "0:0"
    networks:
      - paroquia-net
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./.run:/var/log/paroquia-dev:ro
    depends_on:
      - loki
    mem_limit: 256M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 11. PostgreSQL Exporter - Métricas Internas do Banco de Dados
  # ----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: gestao-postgres-exporter
    restart: unless-stopped
    networks:
      - paroquia-net
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/calendario?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 128M
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# Segredos (montados em /run/secrets/<nome>; lidos do ambiente do host/.env)
# ==============================================================================

secrets:
  metrics_scrape_token:
    environment: APP_METRICS_SCRAPE_TOKEN

# ==============================================================================
# Volumes Persistentes
# ==============================================================================

volumes:
  postgres_data:
    name: paroquia_postgres_data
  shared_volume:
    name: paroquia_shared_volume
  gradle_cache:
    name: paroquia_gradle_cache
  prometheus_data:
    name: paroquia_prometheus_data
  grafana_data:
    name: paroquia_grafana_data
  loki_data:
    name: paroquia_loki_data
