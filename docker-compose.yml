services:
  db:
    image: postgres:16-alpine
    container_name: gestao-db
    environment:
      POSTGRES_DB: calendario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./gestao-paroquia/docker/init-data.sql:/docker-entrypoint-initdb.d/init-data.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d calendario" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 224M
    memswap_limit: 320M
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 224M

  builder:
    build:
      context: ./gestao-paroquia
      dockerfile: ../Dockerfile.builder
    container_name: gestao-builder
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - shared_volume:/shared
      - ./gestao-paroquia:/workspace
      - gradle_cache:/root/.gradle
    mem_limit: 1024M
    memswap_limit: 1280M
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  api:
    build:
      context: ./gestao-paroquia
      dockerfile: ../Dockerfile.api
    container_name: gestao-api
    ports:
      - "8080:8080"
    depends_on:
      builder:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    volumes:
      - shared_volume:/app
    environment:
      - DB_URL=jdbc:postgresql://db:5432/calendario
      - DB_USER=postgres
      - DB_PASSWORD=password
      - PORT=8080
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - JAVA_TOOL_OPTIONS=-Xmx350m -Xms128m -XX:+UseSerialGC
      - APP_CRYPTO_KEY=default-dev-fallback-key-should-be-changed-in-prod
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 512M
    memswap_limit: 640M
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  db-seeder:
    image: postgres:16-alpine
    container_name: gestao-db-seeder
    environment:
      - PGPASSWORD=password
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./gestao-paroquia/docker/seed-data.sql:/seed-data.sql
    command: psql -h db -U postgres -d calendario -f /seed-data.sql
    mem_limit: 128M
    memswap_limit: 128M
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  ui:
    build:
      context: ./gestao-paroquia-ui
      dockerfile: ../Dockerfile.ui
    container_name: gestao-ui
    working_dir: /app
    volumes:
      - ./gestao-paroquia-ui:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1
      - VITE_API_PROXY_TARGET=http://api:8080
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      api:
        condition: service_started
    mem_limit: 1152M
    memswap_limit: 1408M
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1152M

  pgadmin:
    image: dpage/pgadmin4
    container_name: gestao-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    mem_limit: 128M
    memswap_limit: 160M
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  postgres_data:
  shared_volume:
  gradle_cache:
